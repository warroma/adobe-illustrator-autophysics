# Gera os instaladores e publica a release.
#
# Disparo: empurrar uma tag "v*" (ex.: git tag v1.0.0 && git push origin v1.0.0)
# OU, sem git: aba Actions > Release > Run workflow, informando a tag (ex.:
# v1.0.0) — aí o próprio workflow cria a tag no commit escolhido e publica.
# Rodar sem tag só gera os instaladores como artefatos, sem publicar nada.
# Cada sistema é montado na própria plataforma (o electron-builder não gera .dmg
# fora do macOS), e a release usa as notas de docs/release-notes/<tag>.md.
# Os nomes dos arquivos são fixos para o README poder apontar sempre para
# releases/latest/download/<arquivo>.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release a publicar (ex.: v1.0.0). Vazio = só gerar os instaladores."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          # Sem certificado de assinatura (decisão consciente): não procurar um.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            installer/dist/AutoPhysics-Instalador-*.exe
            installer/dist/AutoPhysics-Instalador-*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Se a tag ainda não existe (disparo manual), é criada neste commit.
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: AutoPhysics ${{ env.TAG }}
          body_path: docs/release-notes/${{ env.TAG }}.md
          files: artefatos/*
